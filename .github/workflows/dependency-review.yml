name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          # The one allow list (docs/decisions/001-quality-tooling.md, Licences); the gate's licences step reads it here
          # too and also fails a licence pnpm cannot detect. A new licence is a ruling request.
          allow-licenses: 0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, CC-BY-4.0, CC0-1.0, ISC, MIT, MPL-2.0
          # picomatch <= 4.0.7, no fixed version on 2026-11-17. The owner accepted this advisory by its id; the id
          # allows it on every path (docs/decisions/001-quality-tooling.md, Accepted advisories).
          allow-ghsas: GHSA-fc5q-39xc-vjpf
