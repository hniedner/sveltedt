name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The browser, mutation and selftest steps run in the jobs of those names below; gate-needs refuses these lines without them
    env:
      GATE_BROWSER: job
      GATE_MUTATION: job
      GATE_SELFTEST: job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm first: setup-node's pnpm cache needs it. The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the pinned gitleaks
        run: |
          version="$(sed -n 's/^version //p' scripts/gitleaks.version)"
          sha="$(sed -n 's/^linux_x64_sha256 //p' scripts/gitleaks.version)"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the pinned actionlint
        run: |
          version="$(sed -n 's/^version //p' scripts/actionlint.version)"
          sha="$(sed -n 's/^linux_amd64_sha256 //p' scripts/actionlint.version)"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the pinned zizmor
        run: |
          version="$(sed -n 's/^version //p' scripts/zizmor.version)"
          sha="$(sed -n 's/^linux_x86_64_sha256 //p' scripts/zizmor.version)"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/zizmor-unpacked"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/zizmor-unpacked"
          install -m 755 "$(find "${RUNNER_TEMP}/zizmor-unpacked" -type f -name zizmor)" "${RUNNER_TEMP}/zizmor"
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate
        env:
          # The secrets and commits steps check this range: the pull request's commits, or the pushed ones on main.
          # A missing base makes either step answer could-not-check, never a silent pass.
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # The trace and diff-coverage steps pick their base commit by the event
          GATE_EVENT: ${{ github.event_name }}
        run: pnpm gate
      # Also when the gate fails: the reports say why. A gate that stopped before writing any only warns.
      - name: Upload the gate's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-reports
          path: reports/
          # A re-run of this job in the same workflow run replaces the artifact instead of failing on its name
          overwrite: true
          if-no-files-found: warn

  # The real-browser tests in the three engines, on the site the gate's site step builds. Run in Playwright's own image
  # (browsers and system packages inside, the example of playwright.dev/docs/ci): an apt mirror stall in the install step
  # made runs flaky. gate-needs checks that the tag equals the pinned @playwright/test.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site and run the browser step
        run: |
          node scripts/check-repo.ts site
          node scripts/check-repo.ts browser

  # Mutation testing of the changed lines (G8): StrykerJS in a temporary copy of the tracked files, installed offline
  # from the store the install step fills. In its own job so static's minutes stay as they are.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Mutation step
        env:
          # The step picks its base commit by the event, as trace and diff-coverage do
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_EVENT: ${{ github.event_name }}
        run: node scripts/check-repo.ts mutation

  # The gate's own tests (the selftest step), one shard of scripts/shards.ts per matrix entry; the static job leaves them
  # to this job. gate-needs checks the matrix against the table. Only the pinned gitleaks is installed: the tests of the
  # other tools run against stand-ins.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GATE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the pinned gitleaks
        run: |
          version="$(sed -n 's/^version //p' scripts/gitleaks.version)"
          sha="$(sed -n 's/^linux_x64_sha256 //p' scripts/gitleaks.version)"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Selftest shard
        run: node scripts/check-repo.ts selftest

  gate:
    needs: [static, selftest, browser, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-repo.ts needs "${NEEDS}"
