name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm first: setup-node's pnpm cache needs it. The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the pinned gitleaks
        run: |
          version="$(sed -n 's/^version //p' scripts/gitleaks.version)"
          sha="$(sed -n 's/^linux_x64_sha256 //p' scripts/gitleaks.version)"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the pinned actionlint
        run: |
          version="$(sed -n 's/^version //p' scripts/actionlint.version)"
          sha="$(sed -n 's/^linux_amd64_sha256 //p' scripts/actionlint.version)"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the pinned zizmor
        run: |
          version="$(sed -n 's/^version //p' scripts/zizmor.version)"
          sha="$(sed -n 's/^linux_x86_64_sha256 //p' scripts/zizmor.version)"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/zizmor-unpacked"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/zizmor-unpacked"
          install -m 755 "$(find "${RUNNER_TEMP}/zizmor-unpacked" -type f -name zizmor)" "${RUNNER_TEMP}/zizmor"
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate
        env:
          # The secrets and commits steps check this range: the pull request's commits, or the pushed ones on main.
          # A missing base makes either step answer could-not-check, never a silent pass.
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # The trace and diff-coverage steps pick their base commit by the event
          GATE_EVENT: ${{ github.event_name }}
        run: pnpm gate

  gate:
    needs: [static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-repo.ts needs "${NEEDS}"
