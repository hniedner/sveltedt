name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The browser step runs in the job browser below; gate-needs refuses this line without that job
    env:
      GATE_BROWSER: job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm first: setup-node's pnpm cache needs it. The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the pinned gitleaks
        run: |
          version="$(sed -n 's/^version //p' scripts/gitleaks.version)"
          sha="$(sed -n 's/^linux_x64_sha256 //p' scripts/gitleaks.version)"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the pinned actionlint
        run: |
          version="$(sed -n 's/^version //p' scripts/actionlint.version)"
          sha="$(sed -n 's/^linux_amd64_sha256 //p' scripts/actionlint.version)"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install the pinned zizmor
        run: |
          version="$(sed -n 's/^version //p' scripts/zizmor.version)"
          sha="$(sed -n 's/^linux_x86_64_sha256 //p' scripts/zizmor.version)"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/zizmor-unpacked"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/zizmor-unpacked"
          install -m 755 "$(find "${RUNNER_TEMP}/zizmor-unpacked" -type f -name zizmor)" "${RUNNER_TEMP}/zizmor"
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate
        env:
          # The secrets and commits steps check this range: the pull request's commits, or the pushed ones on main.
          # A missing base makes either step answer could-not-check, never a silent pass.
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # The trace and diff-coverage steps pick their base commit by the event
          GATE_EVENT: ${{ github.event_name }}
        run: pnpm gate
      # Also when the gate fails: the reports say why. A gate that stopped before writing any only warns.
      - name: Upload the gate's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-reports
          path: reports/
          # A re-run of this job in the same workflow run replaces the artifact instead of failing on its name
          overwrite: true
          if-no-files-found: warn

  # The real-browser tests in the three engines, on the site the gate's site step builds. No browser cache: restoring
  # one costs about as much as the download (playwright.dev/docs/ci).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the locked development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the browsers of the pinned Playwright
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build the site and run the browser step
        run: |
          node scripts/check-repo.ts site
          node scripts/check-repo.ts browser

  gate:
    needs: [static, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-repo.ts needs "${NEEDS}"
