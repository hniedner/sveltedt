version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Headers "ci(deps): ...", "build(deps): ...": conventional, as the commit-message check requires from the next
    # pull request (issue #6). Origin: docs/decisions/001-quality-tooling.md.
    commit-message:
      prefix: ci
      include: scope
    # GitHub Actions supports only default-days for cooldown (Dependabot options reference).
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # semver-patch-days must equal pnpm's minimumReleaseAge (pnpm-workspace.yaml); the gate compares them.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
