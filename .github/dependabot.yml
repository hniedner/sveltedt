version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Headers "ci(deps): ..." here and "build(deps-dev): ..." for npm: conventional, as the `commits` step requires.
    # Origin: docs/decisions/001-quality-tooling.md.
    commit-message:
      prefix: ci
      include: scope
    # GitHub Actions supports only default-days for cooldown (Dependabot options reference).
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # The shortest of these must equal pnpm's minimumReleaseAge (pnpm-workspace.yaml); the gate compares them.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # First: a dependency goes to the first group it matches, so Vitest and its coverage provider, which pins the same
      # version, move in one pull request, a major included.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/coverage-v8"]
      # Core and its Vitest runner pin each other's version, so they move in one pull request.
      stryker:
        applies-to: version-updates
        patterns: ["@stryker-mutator/*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
