version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # GitHub Actions supports only default-days for cooldown (Dependabot options reference).
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
